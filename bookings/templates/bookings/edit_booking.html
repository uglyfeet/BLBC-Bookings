<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLBC | Edit Booking</title>
</head>

<body>

    <h1>Edit My Booking</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <p>
        Booking reference: {{ booking.booking_reference }}
    </p>

    <form method="post">
        {% csrf_token %}

        <label for="date">Date:</label>
        <input
            type="date"
            id="date"
            name="date"
            value="{{ booking.date|date:'Y-m-d' }}"
            required>

        <br><br>

        <label for="room">Room:</label>
        <select id="room" name="room" required>
            {% for room in rooms %}
                <option
                    value="{{ room.id }}"
                    {% if room.id == booking.room.id %}selected{% endif %}>
                    {{ room.name }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label for="start_time">Start time:</label>
        <select id="start_time" name="start_time" required>
            {% for time in times %}
                <option
                    value="{{ time }}"
                    {% if time == booking.start_time|time:'H:i' %}selected{% endif %}>
                    {{ time }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label for="end_time">End time:</label>
        <select id="end_time" name="end_time" required>
            {% for time in times %}
                <option
                    value="{{ time }}"
                    {% if time == booking.end_time|time:'H:i' %}selected{% endif %}>
                    {{ time }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <button type="submit">Save Changes</button>
    </form>

    <p>
        Your booking will return to Pending for church approval
        after you save changes.
    </p>

</body>

</html>
