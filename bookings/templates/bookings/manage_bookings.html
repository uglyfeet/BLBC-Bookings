<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLBC | Manage My Bookings</title>
</head>

<body>

    <h1>Manage My Bookings</h1>

    <nav>
        <a href="{% url 'home' %}">Home</a> |
        <a href="{% url 'booking' %}">Make a Booking</a>
    </nav>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <p>Enter the email address and booking reference used when making your booking.</p>

    <form method="post">
        {% csrf_token %}

        <label for="email">Email address:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="booking_reference">Booking reference:</label>
        <input
            type="text"
            id="booking_reference"
            name="booking_reference"
            maxlength="10"
            required>

        <br><br>

        <button type="submit">Find My Booking</button>
    </form>

</body>

</html>
